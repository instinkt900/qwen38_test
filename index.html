<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scorched Earth</title>
<style>
  html, body { margin: 0; padding: 0; background: #050508; height: 100%; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; background: #000; box-shadow: 0 0 60px rgba(0,0,0,.9); }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="640" height="480"></canvas></div>
<script>
'use strict';
/* =====================================================================
   SCORCHED EARTH - HTML5 recreation
   Turn-based artillery: destructible terrain, 7 shell types, wind,
   day/night cycle, AI soldiers, hot-seat pass & play.
   Controls:
     Left/Right  move tank        Up/Down  angle
     +/= -/_     power            1-7      select shell
     Space       fire             Esc/P    pause
     M           mute
   ===================================================================== */

const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

function fitCanvas() {
  const s = Math.min(window.innerWidth / 640, window.innerHeight / 480);
  canvas.style.width  = Math.floor(640 * s) + 'px';
  canvas.style.height = Math.floor(480 * s) + 'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

// ---------------------------------------------------------------------
// constants
// ---------------------------------------------------------------------
const W = 640, H = 480;
const CELL = 4, COLS = W / CELL, ROWS = H / CELL;
const GRAV = 400;
const TANK_W = 16, TANK_H = 11, MAX_HP = 100;

const SHELLS = [
  { name: 'SHELL',   dmg: 34, rad: 18, crater: 18 },
  { name: 'BIG GUN', dmg: 62, rad: 34, crater: 30 },
  { name: 'SMART',   dmg: 34, rad: 18, crater: 18 },
  { name: 'NAPALM',  dmg: 12, rad: 14, crater: 8  },
  { name: 'PARA',    dmg: 6,  rad: 8,  crater: 8  },
  { name: 'SATELLITE',dmg: 8, rad: 10, crater: 8  },
  { name: 'MINE',    dmg: 8,  rad: 8,  crater: 6  },
];
const SHELL_IDX = {};
SHELLS.forEach((s, i) => { s.idx = i; SHELL_IDX[s.name] = i; });

const TANK_COLORS = ['#ff3b3b', '#3b9dff', '#ffd23b', '#7dff3b', '#ff7dff', '#3bffef', '#ff943b', '#ffffff'];
const TANK_NAMES  = ['RED', 'BLUE', 'GOLD', 'GREEN', 'PINK', 'CYAN', 'ORANGE', 'WHITE'];

const AI_SKILL = {
  rookie: { noise: 0.50, smartBias: 0.05 },
  normal: { noise: 0.30, smartBias: 0.20 },
  expert: { noise: 0.13, smartBias: 0.40 },
};

// ---------------------------------------------------------------------
// utils
// ---------------------------------------------------------------------
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = (v, lo, hi) => v < lo ? lo : (v > hi ? hi : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const deg2rad = d => d * Math.PI / 180;
function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
function dist2(x1, y1, x2, y2) { const dx = x1 - x2, dy = y1 - y2; return dx * dx + dy * dy; }
function gauss() { let s = 0; for (let i = 0; i < 4; i++) s += Math.random(); return (s - 2) / 2 * 2; }

// ---------------------------------------------------------------------
// audio (WebAudio synthesis, no assets)
// ---------------------------------------------------------------------
const AudioSys = {
  ctx: null, muted: false,
  init() {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  beep(freq, dur, type, vol, slide) {
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t0 = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t0 + dur);
    g.gain.setValueAtTime(vol || 0.06, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noise(dur, vol, lowpass) {
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t0 = c.currentTime;
    const n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource(); src.buffer = buf;
    const g = c.createGain(); g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lowpass || 900;
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start(t0);
  },
  fire()     { this.noise(0.18, 0.20, 2600); this.beep(170, 0.12, 'sawtooth', 0.08, -120); },
  tick()     { this.beep(680, 0.025, 'square', 0.025); },
  select()   { this.beep(920, 0.05, 'square', 0.04); },
  explosion(r) {
    this.noise(clamp(r / 35, 0.25, 0.85), 0.26, 520);
    this.beep(85, 0.3, 'triangle', 0.16, -55);
  },
  die()      { this.beep(320, 0.4, 'sawtooth', 0.10, -280); this.noise(0.5, 0.18, 420); },
  para()     { this.beep(500, 0.2, 'triangle', 0.06, 200); },
  win()      { const s = this; [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => s.beep(f, 0.22, 'square', 0.07), i * 150)); },
  lose()     { const s = this; [330, 262, 208, 165].forEach((f, i) => setTimeout(() => s.beep(f, 0.25, 'square', 0.07), i * 170)); },
};

// ---------------------------------------------------------------------
// terrain: cell grid, fully destructible, burnable
// ---------------------------------------------------------------------
const terrain = {
  solid: null,
  fire: null,

  generate(seed) {
    const rnd = mulberry32(seed);
    this.solid = new Uint8Array(COLS * ROWS);
    this.fire  = new Float32Array(COLS * ROWS);
    const heights = new Float32Array(COLS);
    const f1 = 25 + rnd() * 45, f2 = 70 + rnd() * 110, f3 = 2.5 + rnd() * 5;
    const p1 = rnd() * 6.28, p2 = rnd() * 6.28, p3 = rnd() * 6.28;
    const a1 = 35 + rnd() * 60, a2 = 12 + rnd() * 22, a3 = 4 + rnd() * 7;
    const base = H * (0.50 + rnd() * 0.14);
    for (let x = 0; x < COLS; x++) {
      heights[x] = base
        + Math.sin(x / f1 + p1) * a1
        + Math.sin(x / f2 + p2) * a2
        + Math.sin(x / f3 + p3) * a3;
    }
    const nFeats = 2 + Math.floor(rnd() * 3);
    for (let f = 0; f < nFeats; f++) {
      const fx = Math.floor(rnd() * COLS), fw = 5 + Math.floor(rnd() * 20);
      const amp = 20 + rnd() * 65;
      const up = rnd() < 0.6;
      for (let x = Math.max(0, fx - fw); x < Math.min(COLS, fx + fw); x++) {
        const d = 1 - Math.abs(x - fx) / fw;
        heights[x] += up ? amp * d * d : -amp * d * d * 0.6;
      }
    }
    for (let x = 0; x < COLS; x++) {
      heights[x] = clamp(heights[x], H * 0.10, H * 0.94);
      const top = Math.ceil(heights[x] / CELL);
      for (let y = top; y < ROWS; y++) this.solid[y * COLS + x] = 1;
    }
    const nCaves = 1 + Math.floor(rnd() * 2);
    for (let c = 0; c < nCaves; c++) {
      this.crater(rand(0, W), rand(H * 0.55, H * 0.95), rand(18, 42));
    }
  },

  inBounds(x, y) { return x >= 0 && x < COLS && y >= 0 && y < ROWS; },

  cellSolid(x, y) { return this.inBounds(x, y) && this.solid[y * COLS + x] === 1; },

  solidAt(px, py) {
    if (px < 0 || px >= W) return true;   // screen sides are walls
    if (py >= H) return true;             // bottom of world
    if (py < 0) return false;
    return this.cellSolid(Math.floor(px / CELL), Math.floor(py / CELL));
  },

  // y of nearest solid surface at-or-below fromY under column x (min over 3 samples)
  groundBelow(px, fromY) {
    let best = H;
    for (const ox of [-5, 0, 5]) {
      const x = clamp(Math.floor((px + ox) / CELL), 0, COLS - 1);
      let y0 = Math.max(0, Math.floor(fromY / CELL));
      for (let y = y0; y < ROWS; y++) {
        if (this.solid[y * COLS + x]) { best = Math.min(best, y * CELL); break; }
      }
    }
    return best;
  },

  topSurfY(px) {
    const x = clamp(Math.floor(px / CELL), 0, COLS - 1);
    for (let y = 0; y < ROWS; y++) if (this.solid[y * COLS + x]) return y * CELL;
    return H;
  },

  crater(cx, cy, r) {
    const r2 = r * r;
    const x0 = Math.max(0, Math.floor((cx - r) / CELL)), x1 = Math.min(COLS - 1, Math.ceil((cx + r) / CELL));
    const y0 = Math.max(0, Math.floor((cy - r) / CELL)), y1 = Math.min(ROWS - 1, Math.ceil((cy + r) / CELL));
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const px = x * CELL + 2, py = y * CELL + 2;
      if (dist2(px, py, cx, cy) <= r2) { this.solid[y * COLS + x] = 0; this.fire[y * COLS + x] = 0; }
    }
  },

  ignite(cx, cy, r, dur) {
    const r2 = r * r;
    const x0 = Math.max(0, Math.floor((cx - r) / CELL)), x1 = Math.min(COLS - 1, Math.ceil((cx + r) / CELL));
    const y0 = Math.max(0, Math.floor((cy - r) / CELL)), y1 = Math.min(ROWS - 1, Math.ceil((cy + r) / CELL));
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const px = x * CELL + 2, py = y * CELL + 2;
      if (dist2(px, py, cx, cy) <= r2 && this.solid[y * COLS + x]) {
        this.fire[y * COLS + x] = Math.max(this.fire[y * COLS + x], dur);
      }
    }
  },

  update(dt) {
    const f = this.fire, s = this.solid;
    for (let i = 0; i < f.length; i++) {
      if (f[i] > 0) {
        f[i] -= dt;
        if (f[i] <= 0) { f[i] = 0; s[i] = 0; }  // burns material away
      }
    }
  },
};

// ---------------------------------------------------------------------
// tanks & little effect helpers
// ---------------------------------------------------------------------
function makeTank(id, color, name, x, y, kind, seat) {
  return {
    id, color, name, kind, seat,
    x, y,                      // y = feet position
    hp: MAX_HP, alive: true,
    angle: 45, power: 40, shell: 0,
    vy: 0, falling: false,
    flash: 0, dmgPop: null, facing: 1,
    ai: null,                  // AI plan, filled on its turn
  };
}
function stockShells() {
  return { smart: 4, para: randInt(0, 3), satellite: randInt(0, 3), mine: randInt(0, 3) };
}
function makeSmokePuffs(x, y, n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), sp = rand(8, 34);
    out.push({ kind: 'smoke', x: x + rand(-3, 3), y: y + rand(-3, 3), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 14, r: rand(3, 7), life: rand(0.5, 1.1), max: 1.1 });
  }
  return out;
}
function makeSparks(x, y, n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = rand(-Math.PI, 0), sp = rand(40, 160);
    out.push({ kind: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.25, 0.6), max: 0.6 });
  }
  return out;
}

// ---------------------------------------------------------------------
// game state
// ---------------------------------------------------------------------
const Game = {
  state: 'menu',               // menu | playing | gameover
  tanks: [], order: [], curIdx: 0,
  wind: 0, turnCount: 0,
  projectile: null,
  effects: [], mines: [], paratroopers: [],
  dayT: 0.25, shake: 0, shakeX: 0, shakeY: 0,
  shellStock: {},
  spotOwner: -1, spotTurnsLeft: 0,
  winner: -1,
  difficulty: 'normal',
  passGate: -1,                 // >=0: waiting for "pass keyboard" Enter on that tank
  aiTimer: 0, postShotTimer: 0,
  msg: '', msgTimer: 0,

  curTank() { const t = this.tanks[this.order[this.curIdx]]; return t || null; },
  humanSeats() {
    const seen = [], out = [];
    for (const i of this.order) {
      const t = this.tanks[i];
      if (t.kind === 'human' && !seen.includes(t.seat)) { seen.push(t.seat); out.push(t.seat); }
    }
    return out;
  },

  setMsg(m, t) { this.msg = m; this.msgTimer = t || 2.5; },

  startGame(tankCount, mode, difficulty) {
    this.tanks = []; this.mines = []; this.paratroopers = []; this.effects = [];
    this.shellStock = {}; this.spotOwner = -1; this.spotTurnsLeft = 0;
    this.difficulty = difficulty || 'normal';
    this.turnCount = 0; this.dayT = 0.25; this.winner = -1;
    this.passGate = -1; this.postShotTimer = 0; this.projectile = null;
    this.aiTimer = 0; this.shake = 0;

    terrain.generate(randInt(1, 1e9));

    for (let i = 0; i < tankCount; i++) {
      const x = clamp(Math.floor((i + 0.5) * W / tankCount) + randInt(-16, 16), 24, W - 24);
      const y = terrain.topSurfY(x);
      const kind = mode === 'solo' ? (i === 0 ? 'human' : 'ai') : 'human';
      const seat = mode === 'solo' ? 0 : i;
      const t = makeTank(i, TANK_COLORS[i % 8], (mode === 'solo' ? (i === 0 ? 'PLAYER' : TANK_NAMES[i % 8]) : 'P' + (i + 1)), x, y - 1, kind, seat);
      this.tanks.push(t);
      this.shellStock[t.id] = stockShells();
    }
    this.order = this.tanks.map((_, i) => i);
    this.curIdx = 0;
    this.state = 'playing';
    UI.screen = 'play';
    this.rollWind();
    this.beginTurn();
  },

  rollWind() { this.wind = randInt(-50, 50); },

  beginTurn() {
    if (this.state !== 'playing') return;
    const t = this.curTank();
    if (!t || !t.alive) { this.finishGame(); return; }
    t.angle = 45; t.power = 40;
    t.ai = null;
    if (this.spotTurnsLeft > 0) { this.spotTurnsLeft--; if (this.spotTurnsLeft <= 0) this.spotOwner = -1; }
    this.turnCount++;
    if (t.kind === 'human') {
      if (this.humanSeats().length > 1) {
        this.passGate = t.id;
        this.setMsg('PASS KEYBOARD TO: ' + t.name, 900);
      } else {
        this.passGate = -1;
        this.setMsg(t.name + '\'S TURN', 1.6);
      }
    } else {
      this.passGate = -1;
      this.aiTimer = rand(0.5, 1.2);
      this.setMsg(t.name + ' IS AIMING', 2.5);
    }
  },

  releasePassGate() {
    if (this.passGate < 0) return;
    this.passGate = -1;
    this.setMsg(this.curTank().name + '\'S TURN', 1.6);
    AudioSys.select();
  },

  endTurn() {
    if (this.state !== 'playing') return;
    let guard = 0;
    do { this.curIdx = (this.curIdx + 1) % this.order.length; }
    while (!this.tanks[this.order[this.curIdx]].alive && guard++ < 16);
    if (guard >= 16) { this.finishGame(); return; }
    this.rollWind();
    this.beginTurn();
  },

  finishGame() {
    const alive = this.tanks.filter(t => t.alive);
    if (alive.length >= 1) {
      let best = alive[0];
      for (const t of alive) if (t.hp > best.hp) best = t;
      this.winner = best.id;
    } else this.winner = -1;
    this.state = 'gameover';
    const wt = this.tanks[this.winner];
    if (wt) { if (wt.kind === 'human') AudioSys.win(); else AudioSys.lose(); }
  },

  removeTank(t) {
    if (!t.alive) return;
    t.alive = false; t.hp = 0;
    const cur = this.curTank();
    const oi = this.order.indexOf(this.tanks.indexOf(t));
    if (oi >= 0) this.order.splice(oi, 1);
    if (this.curIdx >= this.order.length) this.curIdx = 0;
    this.mines = this.mines.filter(m => m.owner !== t.id);
    if (cur === t) this.turnLost = true;
    this.setMsg(t.name + ' IS DESTROYED!', 2.2);
    AudioSys.die();
    const alive = this.tanks.filter(x => x.alive);
    if (alive.length <= 1) this.finishGame();
  },

  addTank(t) {
    const slot = this.tanks.length;
    t.id = slot;
    this.tanks.push(t);
    this.order.push(slot);
    this.shellStock[t.id] = stockShells();
    this.setMsg(t.name + ' HAS DEPLOYED!', 2.0);
  },

  canUseShell(t, idx) {
    const s = SHELLS[idx], st = this.shellStock[t.id];
    if (s.name === 'SMART') return st.smart > 0;
    if (s.name === 'PARA') return st.para > 0 && this.tanks.length < 8;
    if (s.name === 'SATELLITE') return st.satellite > 0;
    if (s.name === 'MINE') return st.mine > 0;
    return true;
  },

  selectShell(t, idx) {
    if (!this.canUseShell(t, idx)) { AudioSys.tick(); return; }
    t.shell = idx; AudioSys.select();
  },

  fire(t, angle, power, shellIdx) {
    const s = SHELLS[shellIdx];
    const bx = t.x + Math.cos(deg2rad(angle)) * 13;
    const by = t.y - 5 - Math.sin(deg2rad(angle)) * 13;
    const v0 = 4 * power + 20;
    this.projectile = {
      x: bx, y: by,
      vx: Math.cos(deg2rad(angle)) * v0,
      vy: -Math.sin(deg2rad(angle)) * v0,
      shell: shellIdx, owner: t.id, t: 0,
      smart: s.name === 'SMART', smartTimer: 0.35,
      smartTarget: null, trail: [],
    };
    t.facing = Math.cos(deg2rad(angle)) >= 0 ? 1 : -1;
    const st = this.shellStock[t.id];
    if (s.name === 'SMART') st.smart--;
    if (s.name === 'PARA') st.para--;
    if (s.name === 'SATELLITE') st.satellite--;
    if (s.name === 'MINE') st.mine--;
    this.effects.push(...makeSmokePuffs(bx, by, 5));
    this.shake = Math.max(this.shake, 1.2);
    AudioSys.fire();
  },

  impact(px, py) {
    const p = this.projectile;
    const s = SHELLS[p.shell];
    if (p.shell === SHELL_IDX.PARA) {
      this.effects.push({ kind: 'boom', x: px, y: py, r: 14, life: 0.2, max: 0.2 });
      this.effects.push(...makeSmokePuffs(px, py, 5));
      this.paratroopers.push({ x: px, y: py - 6, vy: 30, owner: p.owner, t: 0 });
      AudioSys.para();
    } else if (p.shell === SHELL_IDX.SATELLITE) {
      this.spotOwner = p.owner;
      this.spotTurnsLeft = Math.max(1, this.tanks.filter(t => t.alive).length);
      this.explode(px, py, s.rad, s.dmg, p.owner, 'sat');
      this.setMsg('ENEMIES SPOTTED FOR ' + this.spotTurnsLeft + ' TURN' + (this.spotTurnsLeft > 1 ? 'S' : ''), 2.5);
    } else if (p.shell === SHELL_IDX.MINE) {
      this.explode(px, py, s.rad, s.dmg, p.owner, 'mine');
      const my = terrain.groundBelow(px, py);
      this.mines.push({ x: px, y: my - 2, owner: p.owner, dead: false, armed: 0.8 });
    } else if (p.shell === SHELL_IDX.NAPALM) {
      this.explode(px, py, s.rad, s.dmg, p.owner, 'napalm');
      terrain.ignite(px, py, 30, rand(4, 6));
    } else {
      this.explode(px, py, s.rad, s.dmg, p.owner, 'shell');
    }
    this.projectile = null;
    this.postShotTimer = 0.8;
  },

  explode(cx, cy, radius, maxDmg, owner, type) {
    terrain.crater(cx, cy, radius);
    if (type !== 'mine') terrain.ignite(cx, cy, radius * 0.5, rand(1.0, 2.0));
    this.effects.push({ kind: 'boom', x: cx, y: cy, r: radius * 1.7, life: 0.26, max: 0.26 });
    this.effects.push(...makeSmokePuffs(cx, cy, 8 + Math.floor(radius / 5)));
    this.effects.push(...makeSparks(cx, cy, 8));
    this.shake = Math.max(this.shake, clamp(radius / 8, 1, 7));
    AudioSys.explosion(radius);
    for (const t of this.tanks) {
      if (!t.alive) continue;
      const d = Math.sqrt(dist2(cx, cy, t.x, t.y - 4));
      if (d < radius + 6) {
        const dmg = Math.round(maxDmg * (1 - d / (radius + 6)));
        if (dmg > 0) this.damageTank(t, dmg);
      }
    }
    for (const m of this.mines) {
      if (!m.dead && dist2(m.x, m.y, cx, cy) < 24 * 24) {
        m.dead = true;
        this.explode(m.x, m.y, SHELLS[SHELL_IDX.MINE].rad, SHELLS[SHELL_IDX.MINE].dmg, m.owner, 'mine');
      }
    }
  },

  damageTank(t, dmg) {
    if (!t.alive || t.dying) return;
    t.hp = Math.max(0, t.hp - dmg);
    t.flash = 0.4;
    t.dmgPop = { val: dmg, t: 1.2 };
    if (t.hp <= 0) {
      t.dying = true;
      this.explode(t.x, t.y - 4, 24, 24, t.id, 'death');
      this.effects.push(...makeSmokePuffs(t.x, t.y - 4, 14));
      this.removeTank(t);
    }
  },

  update(dt) {
    if (this.msgTimer > 0 && this.msgTimer < 900) this.msgTimer -= dt;
    this.dayT = (this.dayT + dt / 90) % 1;
    if (this.shake > 0) {
      this.shake -= dt * 2;
      this.shakeX = rand(-1, 1) * clamp(this.shake, 0, 5) * 1.6;
      this.shakeY = rand(-1, 1) * clamp(this.shake, 0, 5) * 1.6;
      if (this.shake < 0) { this.shake = 0; this.shakeX = this.shakeY = 0; }
    }
    if (this.state !== 'playing') return;

    terrain.update(dt);

    // tanks: fall, flash timers
    for (const t of this.tanks) {
      if (!t.alive) continue;
      if (t.flash > 0) t.flash -= dt;
      if (t.dmgPop) { t.dmgPop.t -= dt; if (t.dmgPop.t <= 0) t.dmgPop = null; }
      const surf = terrain.topSurfY(t.x);                // standing surface in our column
      const gy = terrain.groundBelow(t.x, t.y + 2);      // floor just below the feet
      if (surf < t.y - 1.5) {                            // ground rose under us (hills / un-embed)
        const rise = t.y - surf;
        t.y = rise <= 7 ? surf : t.y - Math.min(20 * dt, rise);
        t.vy = 0;
      } else if (gy > t.y + 1.5) {                       // ground dropped away
        t.vy += GRAV * dt;
        t.y += t.vy * dt;
        const gy2 = terrain.groundBelow(t.x, t.y + 2);
        if (t.y >= gy2 - 1) { t.y = gy2 - 1; t.vy = 0; }
      }
      t.x = clamp(t.x, 8, W - 8);
    }

    // mines
    for (const m of this.mines) {
      if (m.dead) continue;
      if (m.armed > 0) { m.armed -= dt; continue; }
      for (const t of this.tanks) {
        if (!t.alive) continue;
        if (Math.abs(t.x - m.x) < 12 && Math.abs(t.y - m.y) < 14) {
          m.dead = true;
          this.explode(m.x, m.y, SHELLS[SHELL_IDX.MINE].rad, SHELLS[SHELL_IDX.MINE].dmg, m.owner, 'mine');
          break;
        }
      }
    }

    // projectile
    if (this.projectile) {
      const p = this.projectile;
      p.t += dt;
      const steps = clamp(Math.ceil(Math.hypot(p.vx, p.vy) * dt / 3), 1, 12);
      const sdt = dt / steps;
      let done = false;
      for (let i = 0; i < steps && !done; i++) {
        if (p.smart && p.t > p.smartTimer) {
          let tgt = p.smartTarget && p.smartTarget.alive ? p.smartTarget : null;
          if (!tgt) {
            tgt = null; let bd = 1e9;
            for (const t of this.tanks) {
              if (!t.alive || t.id === p.owner) continue;
              const d = dist2(p.x, p.y, t.x, t.y - 4);
              if (d < bd) { bd = d; tgt = t; }
            }
            p.smartTarget = tgt;
          }
          if (tgt) {
            // true homing: steer velocity toward the target with a gravity
            // feed-forward for the remaining time-to-go. (Re-solving the
            // ballistic arc every substep makes the shell keep launching
            // upward from ever-higher points and never dive in.)
            const tx = tgt.x - p.x, ty = (tgt.y - 4) - p.y;
            const d = Math.hypot(tx, ty) || 1;
            const T = Math.min(0.9, Math.max(0.3, d / 500));
            const vWantX = tx / T;
            const vWantY = ty / T - 0.5 * GRAV * T;
            const k = 1 - Math.exp(-5 * sdt);
            p.vx += (vWantX - p.vx) * k;
            p.vy += (vWantY - p.vy) * k;
            const sp = Math.hypot(p.vx, p.vy);
            if (sp > 480) { p.vx *= 480 / sp; p.vy *= 480 / sp; }
            if (sp < 60) { p.vx *= 60 / sp; p.vy *= 60 / sp; }
          }
        }
        p.vx += this.wind * 1.6 * sdt;
        p.vy += GRAV * sdt;
        p.x += p.vx * sdt; p.y += p.vy * sdt;
        const tl = p.trail;
        if (!tl.length || dist2(p.x, p.y, tl[tl.length - 1].x, tl[tl.length - 1].y) > 12) {
          tl.push({ x: p.x, y: p.y, life: 0.45 });
          if (tl.length > 46) tl.shift();
        }
        for (const m of this.mines) {
          if (!m.dead && m.armed <= 0 && dist2(p.x, p.y, m.x, m.y) < 40) {
            m.dead = true;
            this.explode(m.x, m.y, SHELLS[SHELL_IDX.MINE].rad, SHELLS[SHELL_IDX.MINE].dmg, m.owner, 'mine');
          }
        }
        for (const t of this.tanks) {
          if (!t.alive) continue;
          if (p.x > t.x - 8 && p.x < t.x + 8 && p.y > t.y - 12 && p.y < t.y + 2) {
            this.impact(p.x, p.y); done = true; break;
          }
        }
        if (done) break;
        if (terrain.solidAt(p.x, p.y)) { this.impact(p.x, p.y); done = true; break; }
        if (p.x < -30 || p.x > W + 30 || p.y > H + 30 || p.y < -40) {
          this.projectile = null;
          this.postShotTimer = 0.5;
          done = true;
        }
      }
      // decay trail
      const trail = this.projectile ? this.projectile.trail : [];
      for (const tp of trail) tp.life -= dt;
      if (this.projectile) this.projectile.trail = trail.filter(tp => tp.life > 0);
    }

    // paratroopers: drift down with wind, deploy on ground
    for (const pr of this.paratroopers) {
      pr.t += dt;
      pr.x += this.wind * 0.35;
      pr.y += pr.vy * dt;
      const gy = terrain.groundBelow(pr.x, pr.y + 2);
      if (pr.y >= gy) {
        pr.y = gy;
        const owner = this.tanks[pr.owner];
        const color = owner ? owner.color : '#ffffff';
        const nt = makeTank(-1, color, (owner ? owner.name : 'UNIT') + '-' + (this.tanks.length + 1), clamp(pr.x, 12, W - 12), gy - 1, owner ? owner.kind : 'ai', owner ? owner.seat : 1);
        nt.hp = Math.max(30, Math.round((owner ? owner.hp : 100) * 0.6));
        this.addTank(nt);
        pr.deployed = true;
        this.effects.push(...makeSmokePuffs(pr.x, pr.y, 6));
      }
      pr.x = clamp(pr.x, 8, W - 8);
    }
    this.paratroopers = this.paratroopers.filter(pr => !pr.deployed);

    // burn damage to tanks standing in fire
    for (const t of this.tanks) {
      if (!t.alive) continue;
      const cx = Math.floor(t.x / CELL), cy = Math.floor((t.y - 4) / CELL);
      for (let oy = -2; oy <= 1; oy++) for (let ox = -2; ox <= 2; ox++) {
        const x = cx + ox, y = cy + oy;
        if (terrain.inBounds(x, y) && terrain.fire[y * COLS + x] > 0) {
          t.hp = Math.max(0, t.hp - 6 * dt);
          if (Math.random() < 0.1) this.effects.push({ kind: 'spark', x: x * CELL + 2, y: y * CELL, vx: rand(-8, 8), vy: rand(-30, -10), life: 0.4, max: 0.4 });
          if (t.hp <= 0) {
            t.dying = true;
            this.explode(t.x, t.y - 4, 20, 20, -1, 'death');
            this.removeTank(t);
            if (this.state === 'playing' && !this.projectile && this.postShotTimer <= 0 && this.turnLost) {
              this.turnLost = false;
              this.endTurn();
            }
          }
          break;
        }
      }
    }

    // effects
    for (const e of this.effects) {
      e.life -= dt;
      if (e.kind === 'smoke') { e.x += e.vx * dt; e.y += e.vy * dt; e.vy -= 10 * dt; e.r += 6 * dt; }
      if (e.kind === 'spark') { e.x += e.vx * dt; e.y += e.vy * dt; e.vy += 300 * dt; }
    }
    this.effects = this.effects.filter(e => e.life > 0);

    // AI
    const t = this.curTank();
    if (t && t.kind === 'ai' && this.passGate < 0 && this.projectile === null && this.postShotTimer <= 0 && this.state === 'playing') {
      if (!t.ai) {
        this.aiTimer -= dt;
        if (this.aiTimer <= 0) {
          planAI(t);
          t.shell = t.ai.shell;
          t.ai.timer = rand(0.9, 1.8);
          t.ai.moved = false;
          t.ai.fired = false;
        }
      } else {
        t.ai.timer -= dt;
        if (!t.ai.moved) {
          const remaining = t.ai.move;
          if (remaining === 0) t.ai.moved = true;
          else {
            const step = clamp(remaining, -28 * dt, 28 * dt);
            if (moveTank(t, step)) { t.ai.move -= step; t.facing = step > 0 ? 1 : -1; }
            else t.ai.moved = true;               // blocked by a wall: cancel the move, go fire
            if (Math.abs(t.ai.move) < 0.5) { t.ai.move = 0; t.ai.moved = true; }
          }
        }
        if (!t.ai.moved) { t.ai.timer = Math.max(t.ai.timer, 0.15); }
        if (t.ai.timer <= 0 && !t.ai.fired) {
          t.ai.fired = true;
          if (t.ai.y0 !== undefined && Math.abs(t.y - t.ai.y0) > 3)
            refineAim(t, AI_SKILL[this.difficulty] || AI_SKILL.normal);
          this.fire(t, t.ai.angle, t.ai.power, t.ai.shell);
        }
      }
    }
    if (this.postShotTimer > 0) {
      this.postShotTimer -= dt;
      if (this.postShotTimer <= 0 && this.projectile === null && this.state === 'playing') {
        const ct = this.curTank();
        if (!ct || !ct.alive) { this.finishGame(); return; }
        if (this.turnLost) { this.turnLost = false; this.beginTurn(); }
        else this.endTurn();
      }
    }
  },
//__AI__
};

// AI
// ---------------------------------------------------------------------
// full ballistics with wind; returns { endX, endY, minD, off, buried }
function traceShot(mx, my, angle, power, wind, tgt) {
  let px = mx + Math.cos(deg2rad(angle)) * 13;
  let py = my - Math.sin(deg2rad(angle)) * 13;
  const buried = terrain.solidAt(px, py);
  if (buried) return { eX: px, eY: py, minD: 1e9, off: false, buried: true };
  const v0 = 4 * power + 20;
  let vx = Math.cos(deg2rad(angle)) * v0, vy = -Math.sin(deg2rad(angle)) * v0;
  const dt = 1 / 60, ax = wind * 1.6;
  let minD = 1e9, off = false;
  for (let s = 0; s < 460; s++) {
    vx += ax * dt; vy += GRAV * dt;
    px += vx * dt; py += vy * dt;
    const d = Math.sqrt(dist2(px, py, tgt.x, tgt.y - 4));
    if (d < minD) minD = d;
    if (terrain.solidAt(px, py)) return { eX: px, eY: py, minD, off: false, buried };
    if (py > H + 20 || px < -30 || px > W + 30) { off = true; break; }
  }
  return { eX: px, eY: py, minD, off: true, buried };
}

function scoreShot(mx, my, angle, power, wind, tgt) {
  const r = traceShot(mx, my, angle, power, wind, tgt);
  if (r.buried) return 5000;
  if (r.off) return 4000 + r.minD;
  return Math.sqrt(dist2(r.eX, r.eY, tgt.x, tgt.y - 4)) + r.minD * 0.25;
}

function planAI(t) {
  const skill = AI_SKILL[Game.difficulty] || AI_SKILL.normal;
  const enemies = Game.tanks.filter(x => x.alive && x.id !== t.id);
  const fallback = { move: 0, angle: t.angle, power: t.power, shell: 0, timer: 1, y0: t.y };
  if (!enemies.length) { t.ai = fallback; return; }
  let tgt = enemies[0];
  let bd = 1e9;
  for (const e of enemies) { const d = dist2(t.x, t.y, e.x, e.y); if (d < bd) { bd = d; tgt = e; } }

  // search for the best shot from a given muzzle position
  const searchAt = (cx, cy) => {
    const tx0 = tgt.x - cx, ty0 = (tgt.y - 4) - cy;
    let bAng = 45, bPow = 50, bScore = 1e9;
    const consider = (a, pw) => {
      const s = scoreShot(cx, cy, a, pw, Game.wind, tgt);
      if (s < bScore) { bScore = s; bAng = a; bPow = pw; }
    };
    // analytic power solution per angle (flat-earth, ignores wind)
    for (let a = 15; a <= 165; a += 3) {
      const ca = Math.cos(deg2rad(a)), sa = Math.sin(deg2rad(a));
      if (Math.abs(ca) < 0.2 || tx0 * ca <= 0) continue;
      const denom = ca * ca * (ty0 + tx0 * sa / ca);
      if (denom < 1) continue;
      const v = Math.sqrt((0.5 * GRAV * tx0 * tx0) / denom);
      const pw = (v - 20) / 4;
      if (pw >= 2 && pw <= 100) consider(a, pw);
    }
    // coarse fallback grid (handles high lobs the formula can't reach)
    for (let a = 15; a <= 165; a += 10) for (const pw of [15, 40, 70, 100]) consider(a, pw);
    // near-vertical shots: lobs over cliffs / escape from valleys
    for (let a = 75; a <= 105; a += 5) for (const pw of [70, 90, 100]) consider(a, pw);
    // wind-aware local refinement
    for (let a = bAng - 9; a <= bAng + 9; a += 1.5)
      for (let pw = bPow - 10; pw <= bPow + 10; pw += 2)
        if (pw >= 1) consider(a, pw);
    return { score: bScore, ang: bAng, pow: bPow };
  };

  // try several reposition offsets, keep the one with the best overall shot
  const moveCandidates = new Set([0, -16, 16, -32, 32, -48, 48, -64, 64]);
  if (Math.random() < 0.5) moveCandidates.add(randInt(-20, 20));
  let bestShot = null, move = 0;
  for (const dm of moveCandidates) {
    const mxp = t.x + dm;
    if (mxp < 8 || mxp > W - 8) continue;
    const cand = searchAt(mxp, t.y - 5);
    if (!bestShot || cand.score < bestShot.score) { bestShot = cand; move = dm; }
  }
  let bestAng = bestShot.ang, bestPow = bestShot.pow;
  const bestMiss = bestShot.score;

  // decide shell.
  // SMART is a fallback for shots with no good direct solution: it keeps the
  // best direct arc as its launch and homes from there.
  let shell = 0;
  const st = Game.shellStock[t.id];
  if (bestMiss > 28 && bestMiss < 400 && st.smart > 0 && Math.random() < skill.smartBias + 0.1) {
    // a valid (if inaccurate) arc exists: home from it
    shell = SHELL_IDX.SMART;
    const n = skill.noise;
    bestAng = clamp(bestAng + gauss() * 10 * n, 2, 178);
    bestPow = clamp(bestPow + gauss() * 10 * n, 5, 100);
  } else if (bestMiss < 15 && Math.random() < 0.2) {
    shell = SHELL_IDX['BIG GUN'];
    const n = skill.noise;
    bestAng = clamp(bestAng + gauss() * 20 * n, 2, 178);
    bestPow = clamp(bestPow + gauss() * 24 * n, 5, 100);
  } else {
    const n = skill.noise;
    bestAng = clamp(bestAng + gauss() * 20 * n, 2, 178);
    bestPow = clamp(bestPow + gauss() * 24 * n, 5, 100);
  }
  t.ai = { move, angle: bestAng, power: Math.round(bestPow), shell, timer: 1, y0: t.y };
}

// re-aim locally from the tank's real position (it may have moved in height
// since planAI ran, which invalidates the planned arc)
function refineAim(t, skill) {
  const enemies = Game.tanks.filter(x => x.alive && x.id !== t.id);
  let tgt = null, bd = 1e9;
  for (const e of enemies) { const d = dist2(t.x, t.y, e.x, e.y); if (d < bd) { bd = d; tgt = e; } }
  if (!tgt) return;
  let bAng = t.ai.angle, bPow = t.ai.power, bScore = 1e9;
  for (let a = bAng - 12; a <= bAng + 12; a += 1.5)
    for (let pw = bPow - 12; pw <= bPow + 12; pw += 2) {
      if (pw < 1) continue;
      const s = scoreShot(t.x, t.y - 5, a, pw, Game.wind, tgt);
      if (s < bScore) { bScore = s; bAng = a; bPow = pw; }
    }
  const n = skill.noise;
  t.ai.angle = clamp(bAng + gauss() * 20 * n, 2, 178);
  t.ai.power = Math.round(clamp(bPow + gauss() * 24 * n, 5, 100));
}

const keys = {};
const UI = { screen: 'menu', sel: 0, items: [], diff: 'normal' };

const MENU_ITEMS = [
  '1 PLAYER  (VS AI)',
  '2 PLAYERS  (PASS & PLAY)',
  '3 PLAYERS  (PASS & PLAY)',
  '4 PLAYERS  (PASS & PLAY)',
];
const DIFF_ITEMS = ['ROOKIE', 'NORMAL', 'EXPERT', 'BACK'];

function setMenuItems(list) { UI.items = list; UI.sel = 0; }
setMenuItems(MENU_ITEMS);

function onMenuSelect() {
  if (UI.screen === 'menu') {
    if (UI.sel === 0) { UI.screen = 'difficulty'; setMenuItems(DIFF_ITEMS); }
    else {
      Game.startGame(UI.sel, 'pass', 'normal');
    }
  } else if (UI.screen === 'difficulty') {
    if (UI.sel === 0) Game.startGame(4, 'solo', 'rookie');
    else if (UI.sel === 1) Game.startGame(4, 'solo', 'normal');
    else if (UI.sel === 2) Game.startGame(4, 'solo', 'expert');
    else { UI.screen = 'menu'; setMenuItems(MENU_ITEMS); }
  }
  AudioSys.select();
}

function canControl() {
  if (Game.state !== 'playing' || Game.paused) return false;
  if (Game.passGate >= 0) return false;
  if (Game.projectile || Game.postShotTimer > 0) return false;
  const t = Game.curTank();
  return !!(t && t.kind === 'human');
}

window.addEventListener('keydown', (e) => {
  AudioSys.init(); AudioSys.resume();
  const k = e.key;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(k)) e.preventDefault();
  if (keys[k]) return;   // ignore auto-repeat
  keys[k] = true;

  if (Game.state === 'menu') {
    if (k === 'ArrowUp' || k === 'w' || k === 'W') { UI.sel = (UI.sel + UI.items.length - 1) % UI.items.length; AudioSys.tick(); }
    else if (k === 'ArrowDown' || k === 's' || k === 'S') { UI.sel = (UI.sel + 1) % UI.items.length; AudioSys.tick(); }
    else if (k === 'Enter' || k === ' ') onMenuSelect();
    return;
  }
  if (Game.state === 'gameover') {
    if (k === 'Enter' || k === ' ') { Game.state = 'menu'; UI.screen = 'menu'; setMenuItems(MENU_ITEMS); }
    return;
  }

  // in-game
  if (k === 'm' || k === 'M') { AudioSys.muted = !AudioSys.muted; return; }
  if (k === 'Escape' || k === 'p' || k === 'P') { Game.paused = !Game.paused; return; }

  if (Game.passGate >= 0) {
    if (k === 'Enter' || k === ' ') Game.releasePassGate();
    return;
  }

  if (!canControl()) return;
  const t = Game.curTank();
  if (k >= '1' && k <= '7') Game.selectShell(t, parseInt(k, 10) - 1);
  else if (k === ' ' || k === 'Enter') {
    Game.fire(t, t.angle, t.power, t.shell);
    Game.setMsg('');
  }
});
window.addEventListener('keyup', (e) => { keys[e.key] = false; });

// driving: no overhangs exist (craters only remove solid), so each column's
// standing surface is topSurfY. Climb when the surface rises at/above the feet
// (capped by slope + a 2-cell step); descend by letting the fall logic drop us.
function moveTank(t, dx) {
  if (dx === 0) return false;
  const dir = Math.sign(dx);
  const nx = clamp(t.x + dx, 8, W - 8);
  if (nx === t.x) return false;
  const leadX = clamp(nx + dir * 9, 0, W - 1);
  const climb = terrain.topSurfY(t.x) - terrain.topSurfY(leadX);  // >0 = uphill
  // allow slopes up to ~50 over the 9 px look-ahead (and 2-cell steps); walls block
  if (climb > 9 * 1.2 + Math.abs(dx) * 1.5) return false;
  t.x = nx;
  const surf = terrain.topSurfY(t.x);
  if (surf < t.y - 1.5) t.y = surf;   // ride up; descents handled by the fall logic
  return true;
}

// human held-key control (movement / aim), applied in the game loop
let moveTickAt = 0;
function applyHumanControl(dt) {
  if (!canControl()) return;
  const t = Game.curTank();
  const speed = 10 + (t.hp / MAX_HP) * 40;
  let moved = false;
  if (keys['ArrowLeft'] || keys['a'] || keys['A'])  { if (moveTank(t, -speed * dt)) { t.facing = -1; moved = true; } }
  if (keys['ArrowRight'] || keys['d'] || keys['D']) { if (moveTank(t, +speed * dt)) { t.facing = 1; moved = true; } }
  if (moved && performance.now() > moveTickAt) { AudioSys.tick(); moveTickAt = performance.now() + 130; }
  if (keys['ArrowUp'] || keys['w'] || keys['W'])   t.angle = Math.min(179, t.angle + 55 * dt);
  if (keys['ArrowDown'] || keys['s'] || keys['S']) t.angle = Math.max(1, t.angle - 55 * dt);
  if (keys['+'] || keys['='] || keys['NumpadAdd'])  t.power = Math.min(100, t.power + 30 * dt);
  if (keys['-'] || keys['_'] || keys['NumpadSubtract']) t.power = Math.max(1, t.power - 30 * dt);
}

function hexToRgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mix(c1, c2, t) { return 'rgb(' + Math.round(lerp(c1[0], c2[0], t)) + ',' + Math.round(lerp(c1[1], c2[1], t)) + ',' + Math.round(lerp(c1[2], c2[2], t)) + ')'; }

const SKY_DAY_TOP = [96, 158, 205], SKY_DAY_BOT = [158, 199, 214];
const SKY_NIGHT_TOP = [8, 10, 34], SKY_NIGHT_BOT = [26, 30, 66];
const GROUND_TOP = [201, 140, 84], GROUND_MID = [148, 92, 50], GROUND_DEEP = [96, 58, 32];
function brighten(c, f) { return 'rgb(' + clamp(Math.round(c[0] * f), 0, 255) + ',' + clamp(Math.round(c[1] * f), 0, 255) + ',' + clamp(Math.round(c[2] * f), 0, 255) + ')'; }

function drawSky() {
  const b = 0.5 + 0.5 * Math.cos(Game.dayT * Math.PI * 2);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, mix(SKY_NIGHT_TOP, SKY_DAY_TOP, b));
  g.addColorStop(1, mix(SKY_NIGHT_BOT, SKY_DAY_BOT, b));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  if (b < 0.55) {
    const a = 1 - b / 0.55;
    const t = performance.now() / 1000;
    for (const s of STARS) {
      const tw = 0.6 + 0.4 * Math.sin(t * 2 + s.p);
      ctx.fillStyle = 'rgba(255,255,255,' + (a * tw * 0.9).toFixed(3) + ')';
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
  }
}

function drawTerrain() {
  const s = terrain.solid;
  const b = 0.5 + 0.5 * Math.cos(Game.dayT * Math.PI * 2);
  const light = lerp(0.55, 1.0, b);
  for (let x = 0; x < COLS; x++) {
    let y = 0;
    while (y < ROWS) {
      if (s[y * COLS + x]) {
        const y0 = y;
        while (y < ROWS && s[y * COLS + x]) y++;
        const px = x * CELL, py0 = y0 * CELL, ph = (y - y0) * CELL;
        const depth = py0 / H;
        const c = mix(GROUND_DEEP, mix(GROUND_MID, GROUND_TOP, clamp(1 - depth * 1.8, 0, 1)), y - y0 > 30 ? 0.5 : 1);
        ctx.fillStyle = c;
        ctx.globalAlpha = light;
        ctx.fillRect(px, py0, CELL, ph);
        ctx.globalAlpha = 1;
        if (y0 > 0 && !s[(y0 - 1) * COLS + x]) {
          ctx.fillStyle = brighten(GROUND_TOP, 1.15 * light);
          ctx.fillRect(px, py0, CELL, 3);
        }
        const f = terrain.fire[y0 * COLS + x];
        if (f > 0) {
          const fl = 0.6 + 0.4 * Math.sin(performance.now() / 40 + x * 3);
          ctx.fillStyle = 'rgba(255,' + Math.round(120 + 80 * fl) + ',20,' + (0.5 + 0.5 * fl * (f / 6 > 1 ? 1 : f / 6)) + ')';
          ctx.fillRect(px, py0, CELL, Math.min(ph, 14));
        }
      } else y++;
    }
  }
}

function drawMine(m) {
  ctx.fillStyle = '#2c2c2c';
  ctx.fillRect(m.x - 5, m.y - 3, 10, 6);
  ctx.fillStyle = m.armed > 0 ? '#884444' : (Math.sin(performance.now() / 200) > 0 ? '#ff4444' : '#881111');
  ctx.fillRect(m.x - 1, m.y - 2, 2, 2);
}

function drawTank(t, active) {
  const x = t.x, y = t.y;
  if (t.flash > 0 && Math.floor(t.flash * 30) % 2 === 0) {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x - 9, y - 13, 18, 14);
    return;
  }
  const c = t.color;
  // barrel
  ctx.strokeStyle = '#3a3a3a';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x + t.facing * 1, y - 7);
  const bl = 12;
  ctx.lineTo(x + t.facing * 1 + Math.cos(deg2rad(t.angle)) * bl * t.facing, y - 7 - Math.sin(deg2rad(t.angle)) * bl);
  ctx.stroke();
  // tracks
  ctx.fillStyle = '#262626';
  ctx.fillRect(x - 8, y - 4, 16, 5);
  ctx.fillStyle = '#4a4a4a';
  for (let i = -6; i <= 6; i += 4) {
    const step = Math.floor(performance.now() / 100) % 4;
    ctx.fillRect(x + i - 1, y - 3 + ((step + i) % 2), 2, 2);
  }
  // body
  ctx.fillStyle = c;
  ctx.fillRect(x - 7, y - 10, 14, 5);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(x - 7, y - 7, 14, 2);
  // turret
  ctx.fillStyle = c;
  ctx.fillRect(x - 4, y - 13, 8, 4);
  // flag
  const wave = Math.sin(performance.now() / 180 + t.id) * 1.5;
  ctx.strokeStyle = '#dddddd';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x, y - 13); ctx.lineTo(x, y - 21); ctx.stroke();
  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.moveTo(x, y - 21); ctx.lineTo(x + 7, y - 19 + wave * 0.4); ctx.lineTo(x, y - 17);
  ctx.closePath(); ctx.fill();
  // hp bar above
  const hpF = t.hp / MAX_HP;
  ctx.fillStyle = '#000000';
  ctx.fillRect(x - 9, y - 26, 18, 3);
  ctx.fillStyle = hpF > 0.5 ? '#44dd44' : hpF > 0.25 ? '#ddcc22' : '#ff4422';
  ctx.fillRect(x - 8, y - 25, Math.max(0, Math.round(16 * hpF)), 1);
  // damage pop
  if (t.dmgPop) {
    const p = t.dmgPop;
    ctx.fillStyle = 'rgba(255,80,60,' + clamp(p.t, 0, 1) + ')';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('-' + Math.round(p.val), x, y - 32 - (1.2 - p.t) * 6);
  }
  // active marker
  if (active && Math.floor(performance.now() / 250) % 2 === 0) {
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x - 13, y + 2); ctx.lineTo(x - 10, y - 4); ctx.lineTo(x - 7, y + 2);
    ctx.moveTo(x + 7, y + 2); ctx.lineTo(x + 10, y - 4); ctx.lineTo(x + 13, y + 2);
    ctx.stroke();
  }
}

function drawBarrelAim(t) {
  // faint aim direction line for the active human tank
  const bl = 26 + t.power * 0.4;
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 4]);
  ctx.beginPath();
  ctx.moveTo(t.x + t.facing * 1, t.y - 7);
  ctx.lineTo(t.x + t.facing * 1 + Math.cos(deg2rad(t.angle)) * bl * t.facing, t.y - 7 - Math.sin(deg2rad(t.angle)) * bl);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawProjectile() {
  const p = Game.projectile;
  if (!p) return;
  const col = p.shell === SHELL_IDX.NAPALM ? '#ffaa22' : p.shell === SHELL_IDX.SATELLITE ? '#66ccff' : p.shell === SHELL_IDX.MINE ? '#cccccc' : p.shell === SHELL_IDX.PARA ? '#ff66ff' : '#ffffff';
  for (let i = 0; i < p.trail.length; i++) {
    const tp = p.trail[i];
    ctx.fillStyle = 'rgba(200,200,200,' + (tp.life * 1.4) + ')';
    ctx.fillRect(tp.x - 1, tp.y - 1, 2, 2);
  }
  ctx.fillStyle = col;
  ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  if (p.shell === SHELL_IDX['BIG GUN']) ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
}

function drawParatrooper(pr) {
  const sway = Math.sin(pr.t * 3) * 2;
  ctx.strokeStyle = '#cccccc';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(pr.x + sway, pr.y - 8, 8, Math.PI, 0);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(pr.x + sway - 7, pr.y - 7); ctx.lineTo(pr.x - 3, pr.y - 1);
  ctx.moveTo(pr.x + sway + 7, pr.y - 7); ctx.lineTo(pr.x + 3, pr.y - 1);
  ctx.stroke();
  ctx.fillStyle = '#8899aa';
  ctx.fillRect(pr.x - 3, pr.y - 2, 6, 5);
}

function drawEffects() {
  for (const e of Game.effects) {
    const f = e.life / e.max;
    if (e.kind === 'boom') {
      const r = e.r * (1.4 - f * 0.4);
      ctx.globalAlpha = f;
      const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, r);
      g.addColorStop(0, '#fff7c0');
      g.addColorStop(0.4, '#ffaa33');
      g.addColorStop(1, 'rgba(255,80,10,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (e.kind === 'smoke') {
      ctx.globalAlpha = f * 0.5;
      ctx.fillStyle = '#888888';
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (e.kind === 'spark') {
      ctx.globalAlpha = f;
      ctx.fillStyle = '#ffcc55';
      ctx.fillRect(e.x - 1, e.y - 1, 2, 2);
      ctx.globalAlpha = 1;
    }
  }
}

// --- HUD ---------------------------------------------------------------
function drawShellIcon(x, y, idx, selected, count) {
  if (selected) {
    ctx.strokeStyle = '#ffffff';
    ctx.strokeRect(x - 1, y - 1, 15, 17);
  }
  const cx = x + 7, cy = y + 9;
  if (idx === 0) { ctx.fillStyle = '#ddd'; ctx.fillRect(cx - 2, cy - 2, 4, 4); }
  else if (idx === 1) { ctx.fillStyle = '#ddd'; ctx.fillRect(cx - 4, cy - 4, 8, 8); }
  else if (idx === 2) { ctx.fillStyle = '#7dff7d'; ctx.beginPath(); ctx.moveTo(cx, cy - 5); ctx.lineTo(cx + 4, cy + 3); ctx.lineTo(cx - 4, cy + 3); ctx.fill(); }
  else if (idx === 3) { ctx.fillStyle = '#ff9933'; ctx.beginPath(); ctx.arc(cx, cy + 1, 4, 0, 7); ctx.fill(); }
  else if (idx === 4) { ctx.strokeStyle = '#ff88ff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, cy - 1, 5, Math.PI, 0); ctx.stroke(); ctx.fillRect(cx - 3, cy + 2, 6, 3); }
  else if (idx === 5) { ctx.fillStyle = '#66ccff'; ctx.beginPath(); ctx.moveTo(cx, cy - 5); ctx.lineTo(cx + 5, cy); ctx.lineTo(cx, cy + 5); ctx.lineTo(cx - 5, cy); ctx.fill(); }
  else if (idx === 6) { ctx.fillStyle = '#999'; ctx.fillRect(cx - 4, cy - 2, 8, 5); ctx.fillStyle = '#ff4444'; ctx.fillRect(cx - 1, cy - 4, 2, 2); }
  if (count !== undefined) {
    ctx.fillStyle = count > 0 ? '#aaaaaa' : '#555555';
    ctx.font = '7px monospace';
    ctx.textAlign = 'right';
    ctx.fillText(String(count), x + 13, y + 4);
  }
}

function drawHUD() {
  const t = Game.curTank();
  if (!t) return;
  // top bar: turn + wind
  ctx.font = '9px monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('TURN ' + Game.turnCount, 6, 12);
  // wind center
  ctx.textAlign = 'center';
  ctx.fillText('WIND', W / 2, 10);
  const wl = Game.wind;
  ctx.fillStyle = '#ffffff';
  const ax0 = W / 2 - wl * 0.9, ax1 = W / 2 + wl * 0.9;
  if (Math.abs(wl) > 1) {
    ctx.fillRect(Math.min(ax0, ax1), 14, Math.abs(wl) * 1.8, 2);
    ctx.beginPath();
    if (wl > 0) { ctx.moveTo(ax1, 11); ctx.lineTo(ax1 + 5, 15); ctx.lineTo(ax1, 19); }
    else { ctx.moveTo(ax0, 11); ctx.lineTo(ax0 - 5, 15); ctx.lineTo(ax0, 19); }
    ctx.fill();
  } else {
    ctx.fillText('0', W / 2, 20);
  }
  // selected shell name
  ctx.textAlign = 'left';
  ctx.fillStyle = '#cccccc';
  ctx.fillText('SHELL: ' + SHELLS[t.shell].name, W / 2 + 40, 12);
  // satellite spotted indicator
  if (Game.spotOwner >= 0 && Game.spotTurnsLeft > 0) {
    ctx.textAlign = 'right';
    ctx.fillStyle = '#66ccff';
    ctx.fillText('SATELLITE ACTIVE', W - 6, 12);
  }
  ctx.textAlign = 'left';

  // status plate
  const px = 4, py = H - 66, pw = 152, ph = 62;
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(px, py, pw, ph);
  ctx.strokeStyle = t.color;
  ctx.lineWidth = 1;
  ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
  ctx.fillStyle = t.color;
  ctx.font = 'bold 9px monospace';
  ctx.fillText(t.name, px + 6, py + 12);
  // hp
  const hpF = t.hp / MAX_HP;
  ctx.fillStyle = '#333';
  ctx.fillRect(px + 6, py + 18, 90, 8);
  ctx.fillStyle = hpF > 0.5 ? '#44dd44' : hpF > 0.25 ? '#ddcc22' : '#ff4422';
  ctx.fillRect(px + 7, py + 19, Math.round(88 * hpF), 6);
  ctx.fillStyle = '#fff';
  ctx.font = '8px monospace';
  ctx.fillText(String(Math.round(t.hp)), px + 100, py + 25);
  // shells
  const st = Game.shellStock[t.id];
  for (let i = 0; i < 7; i++) {
    const sx = px + 6 + i * 17, sy = py + 34;
    let count;
    if (i === SHELL_IDX.SMART) count = st.smart;
    else if (i === SHELL_IDX.PARA) count = st.para;
    else if (i === SHELL_IDX.SATELLITE) count = st.satellite;
    else if (i === SHELL_IDX.MINE) count = st.mine;
    else count = undefined;
    const avail = Game.canUseShell(t, i);
    if (!avail && count !== undefined) ctx.globalAlpha = 0.35;
    drawShellIcon(sx, sy, i, t.shell === i, count);
    ctx.globalAlpha = 1;
  }
  // controls hint on human turns
  if (t.kind === 'human' && Game.passGate < 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(px, py + 50, pw, 11);
    ctx.fillStyle = '#cccccc';
    ctx.font = '7px monospace';
    ctx.fillText('MOVE:< >  AIM:^v  PWR:+-  FIRE:SPACE', px + 4, py + 58);
  }
  // angle / power readout (top row, right side of the plate)
  ctx.font = '8px monospace';
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffd23b';
  ctx.fillText('PWR ' + String(Math.round(t.power)).padStart(3, '0'), px + pw - 6, py + 12);
  ctx.fillStyle = '#ffffff';
  ctx.fillText('ANG ' + String(Math.round(t.angle)).padStart(3, '0'), px + pw - 46, py + 12);
  ctx.textAlign = 'left';
}

function drawSpots() {
  if (Game.spotOwner < 0 || Game.spotTurnsLeft <= 0) return;
  const owner = Game.tanks[Game.spotOwner];
  for (const t of Game.tanks) {
    if (!t.alive || t.id === Game.spotOwner) continue;
    if (owner && t === Game.curTank()) continue;
    const blink = Math.floor(performance.now() / 200) % 2 === 0;
    if (blink) {
      ctx.strokeStyle = '#66ccff';
      ctx.lineWidth = 1;
      ctx.strokeRect(t.x - 11, t.y - 27, 22, 27);
      ctx.font = '7px monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#66ccff';
      ctx.fillText(t.name, t.x, t.y - 29);
    }
  }
}

function drawMessage() {
  if (!Game.msg || Game.msgTimer <= 0) return;
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  const w = ctx.measureText(Game.msg).width + 16;
  ctx.fillRect(W / 2 - w / 2, 26, w, 18);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(Game.msg, W / 2, 39);
}

function drawPassGate() {
  ctx.fillStyle = 'rgba(0,0,0,0.92)';
  ctx.fillRect(0, 0, W, H);
  const t = Game.curTank();
  ctx.textAlign = 'center';
  ctx.font = 'bold 16px monospace';
  ctx.fillStyle = t ? t.color : '#fff';
  ctx.fillText('PASS THE KEYBOARD TO', W / 2, H / 2 - 40);
  ctx.font = 'bold 26px monospace';
  ctx.fillText(t ? t.name : '', W / 2, H / 2);
  ctx.font = '10px monospace';
  ctx.fillStyle = '#cccccc';
  if (Math.floor(performance.now() / 400) % 2 === 0) ctx.fillText('PRESS ENTER WHEN READY', W / 2, H / 2 + 40);
  ctx.fillText('YOUR AIM WILL BE HIDDEN', W / 2, H / 2 + 58);
}

function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 20px monospace';
  ctx.fillStyle = '#fff';
  ctx.fillText('PAUSED', W / 2, H / 2);
  ctx.font = '10px monospace';
  ctx.fillText('PRESS P TO RESUME', W / 2, H / 2 + 24);
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  const wt = Game.tanks[Game.winner];
  if (wt) {
    ctx.font = 'bold 24px monospace';
    ctx.fillStyle = wt.color;
    ctx.fillText(wt.name + ' WINS!', W / 2, H / 2 - 20);
    ctx.font = '11px monospace';
    ctx.fillStyle = '#ccc';
    const msg = wt.kind === 'human' ? 'THE EARTH IS SCORCHED. YOU SURVIVED.' : 'DEFEAT. THE EARTH IS SCORCHED.';
    ctx.fillText(msg, W / 2, H / 2 + 8);
  } else {
    ctx.font = 'bold 24px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('MUTUAL DESTRUCTION', W / 2, H / 2 - 20);
  }
  ctx.font = '10px monospace';
  ctx.fillStyle = '#ffff88';
  if (Math.floor(performance.now() / 400) % 2 === 0) ctx.fillText('PRESS ENTER FOR MENU', W / 2, H / 2 + 44);
}

function drawMenu() {
  drawSky();
  // big title
  ctx.textAlign = 'center';
  const t = performance.now() / 1000;
  ctx.font = 'bold 34px monospace';
  ctx.fillStyle = '#c26a3a';
  ctx.fillText('SCORCHED EARTH', W / 2 + 2, 92);
  ctx.fillStyle = '#ffd23b';
  ctx.fillText('SCORCHED EARTH', W / 2, 90);
  ctx.font = '10px monospace';
  ctx.fillStyle = '#9ab';
  ctx.fillText('A FAITHFUL HTML5 RECREATION', W / 2, 112);
  // items
  ctx.font = 'bold 13px monospace';
  for (let i = 0; i < UI.items.length; i++) {
    const y = 170 + i * 26;
    if (i === UI.sel) {
      ctx.fillStyle = '#ffff88';
      ctx.fillText('> ' + UI.items[i] + ' <', W / 2, y);
      ctx.fillStyle = 'rgba(255,255,136,0.12)';
      ctx.fillRect(W / 2 - 190, y - 14, 380, 19);
    } else {
      ctx.fillStyle = '#d8d8e8';
      ctx.fillText(UI.items[i], W / 2, y);
    }
  }
  // decor: two tanks
  ctx.fillStyle = '#ff3b3b'; ctx.fillRect(70, 330, 16, 5); ctx.fillRect(65, 335, 26, 5);
  ctx.fillStyle = '#3b9dff'; ctx.fillRect(W - 96, 350, 16, 5); ctx.fillRect(W - 101, 355, 26, 5);
  // help
  ctx.font = '9px monospace';
  ctx.fillStyle = '#8899aa';
  const hh = UI.screen === 'menu'
    ? 'UP/DOWN SELECT - ENTER START'
    : 'UP/DOWN SELECT - ENTER START (HUMAN VS 3 AI SOLDIERS)';
  ctx.fillText(hh, W / 2, 420);
  ctx.fillStyle = '#667788';
  const help = [
    'LEFT/RIGHT  MOVE          UP/DOWN   AIM',
    '+ / -       POWER         1-7       SHELL',
    'SPACE       FIRE          P         PAUSE',
  ];
  help.forEach((l, i) => ctx.fillText(l, W / 2, 442 + i * 12));
  // weapon legend
  ctx.fillStyle = '#778899';
  ctx.font = '8px monospace';
  const legend = [
    '1 SHELL: STANDARD      2 BIG GUN: HEAVY DMG      3 SMART: HOMING',
    '4 NAPALM: SETS FIRE    5 PARA: DROPS TANKER      6 SATELLITE: SPOTS     7 MINE: TRAPS GROUND',
  ];
  legend.forEach((l, i) => ctx.fillText(l, W / 2, 372 + i * 12));
  // footer
  ctx.fillStyle = '#445';
  ctx.fillText('TANKS TAKE DAMAGE FROM SHOTS, FIRE AND MINES', W / 2, H - 8);
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (Game.state === 'menu') { drawMenu(); return; }
  ctx.save();
  ctx.translate(Game.shakeX, Game.shakeY);
  drawSky();
  drawTerrain();
  for (const m of Game.mines) if (!m.dead) drawMine(m);
  const active = Game.passGate < 0 && !Game.projectile && Game.postShotTimer <= 0 ? Game.curTank() : null;
  for (const t of Game.tanks) if (t.alive && !(active && t === active)) drawTank(t, false);
  if (active) { drawTank(active, true); if (active.kind === 'human') drawBarrelAim(active); }
  for (const pr of Game.paratroopers) drawParatrooper(pr);
  drawProjectile();
  drawEffects();
  drawSpots();
  ctx.restore();
  drawHUD();
  drawMessage();
  if (Game.passGate >= 0) drawPassGate();
  if (Game.paused) drawPause();
  if (Game.state === 'gameover') drawGameOver();
}

// ---------------------------------------------------------------------
// main loop + test hooks
// ---------------------------------------------------------------------
let lastTime = performance.now();
function frame(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.05) dt = 0.05;
  if (!Game.paused) {
    if (Game.state === 'playing') {
      applyHumanControl(dt);
      Game.update(dt);
    }
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// headless test hooks
if (typeof window !== 'undefined') {
  window.SE = { Game, terrain, keys, UI, planAI, scoreShot, traceShot, applyHumanControl, MAX_HP, W, H };
}
</script>
